# CI for the QuranlyHub landing page.
#
# The site is three dependency-free static files, so this workflow needs no
# build step. It checks the things that silently rot when the HTML is
# hand-edited: markup validity, the invariants in scripts/validate-page.mjs
# (JSON-LD parses and matches the visible FAQ, no broken anchors or missing
# assets, every input labelled, one <h1>, a sane meta description length),
# and Lighthouse performance/accessibility/SEO budgets.
#
# Tool versions are pinned to match what was verified locally before this
# workflow was added, so a first run isn't a surprise.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR instead of queuing them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Markup validity + page-specific invariants (schema/FAQ parity, one
  # H1, resolvable anchors, present assets, labelled form controls…).
  # ------------------------------------------------------------------
  validate:
    name: HTML validity & page invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: html-validate
        run: npx --yes html-validate@9 --formatter stylish index.html

      - name: Page invariants (schema/FAQ parity, anchors, assets, labels…)
        run: node scripts/validate-page.mjs

  # ------------------------------------------------------------------
  # Lighthouse performance / accessibility / best-practices / SEO.
  # Desktop preset — this is a desktop-first SaaS-style landing page and
  # the layout is mobile-first responsive CSS, not a separate build.
  # ------------------------------------------------------------------
  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Serve the site
        run: |
          npx --yes http-server@14 -p 8080 -s &
          npx --yes wait-on@8 http://127.0.0.1:8080/index.html

      - name: Run Lighthouse
        run: |
          npx --yes lighthouse@12 http://127.0.0.1:8080/index.html \
            --output=json \
            --output-path=./lighthouse-report.json \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage" \
            --preset=desktop \
            --quiet

      - name: Check budgets
        run: node scripts/check-lighthouse.mjs ./lighthouse-report.json

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          retention-days: 14
